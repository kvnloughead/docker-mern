version: '3.8'

services:
  # MongoDB database
  mongodb:
    image: mongo:8.0
    container_name: wtwr-mongodb
    ports:
      - "27017:27017"
    volumes:
      # Persist data across container restarts
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/wtwr_db --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wtwr-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_PORT=${NODE_PORT}
      - MONGODB_URI=${MONGODB_URI}
      - NODE_ENV=${NODE_ENV}
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  # Frontend React app
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wtwr-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  # Named volume for MongoDB persistence
  mongodb_data: